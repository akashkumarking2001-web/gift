  <!-- Suppress TFJS Kernel Warnings -->
  <script>
    (function() {
      const originalWarn = console.warn;
      console.warn = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('is already registered')) return;
        originalWarn.apply(console, args);
      };
    })();
  </script>
